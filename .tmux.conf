#Configurando nova hotkey chave
set-option -g prefix ^S
#adicionando suporte a cores terminal
set-option -sa terminal-overrides ",xterm*:Tc"
#criando suporte com o mouse
set -g mouse on
#criando index inicial de 1
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on
#tmux-yank
# <prefix> + [
#vim-like comands
set-window-option -g mode-keys vi
#keybindings
# DEVE TER xclip ou xsel
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
#Configurando em abrir painel no diretório atual
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
# set -g default-terminal "screen-256color"
#configurando hotkeys para redimensionamento de janelas
# bind-key -r -T prefix C-k resize-pane -U
# bind-key -r -T prefix C-j resize-pane -D
# bind-key -r -T prefix C-h resize-pane -L
# bind-key -r -T prefix C-l resize-pane -R

# Hotkeys para criação e manuseio de janelas
# bind-key C-t new-window
# bind-key C-w kill-window
